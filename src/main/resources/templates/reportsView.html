<html xmlns:th="http://www.thymeleaf.org"
        th:replace="~{viewTemplate :: viewLayout('Reports', 'List of Reports', 'reports', ~{::content})}">
<body>
    <th:block th:fragment="content">
        <!-- Page Specific content-->

        <div class="keyword-filter">
            <div class="keyword-filter-wrap">
                <input type="text" id="keyword" name="keyword" placeholder="Search by location or keyword" autocomplete="off">
                <img class="icon" th:src="@{/icons/magnify.svg}" alt="">
            </div>
        </div>

        <div class="panel">
            <table class="detail-table">
                    <tr>
                        <th style="width: 25px; background-color: rgb(200, 200, 200);">
                            <input type="checkbox" id="all-incidents" value="No">
                        </th>
                        <th style="width: 8%; background-color: rgb(200, 200, 200);">Incident ID</th>
                        <th style="width: fit-content; background-color: rgb(200, 200, 200);">Date</th>
                        <th style="width: fit-content; background-color: rgb(200, 200, 200);">Location</th>
                        <th style="width: 20%; background-color: rgb(200, 200, 200);">Vehicle</th>
                        <th style="width: fit-content; background-color: rgb(200, 200, 200);">License Plate</th>
                        <th style="width: min-content; background-color: rgb(200, 200, 200);">Driver</th>
                        <th style="width: fit-content; background-color: rgb(200, 200, 200);">Imagae Preview</th>
                    </tr>
                    <tr th:each="incident : ${incidents}">
                            <td>
                            <input type="checkbox" th:id="|incident-${incident.incidentId}|" value="No">
                            </td>
                            <td th:text="${incident.incidentId}">N/A</td>
                            <td th:text="${#temporals.format(incident.createdTime, 'MM/dd/yyyy h:mm a')}">N/A</td>
                            <td th:text="${#numbers.formatDecimal(incident.latitude, 1, 4)} + ', ' + ${#numbers.formatDecimal(incident.longitude, 1, 4)}">N/A</td>
                            <td th:text="${incident.vehicleColor} + ' ' + ${incident.vehicleYear} + ' ' + ${incident.vehicleMake} + ' ' + ${incident.vehicleModel}">N/A</td>
                            <td th:text="${incident.licensePlate}">N/A</td>
                            <td th:text="${incident.driverPresent} ? 'Yes' : 'No'">No</td>
                            <td><span class="preview-placeholder"></span></td>
                    </tr>
            </table>
        </div>

    </th:block>
</body>
</html>
