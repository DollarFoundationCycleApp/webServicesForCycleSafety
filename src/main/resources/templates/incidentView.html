<html xmlns:th="http://www.thymeleaf.org"
        th:replace="~{viewTemplate :: viewLayout('Incident', 'Incident Details', 'incidents', ~{::content})}">
<body>
    <th:block th:fragment="content">
        <!-- Page Specific content-->

            <div class="panel">
                 <div class="panel-title" th:text="'Incident ' + ${incident.incidentId}">Incident</div>
                 <table>
                     <tbody>
                         <tr><th>Reported</th><td th:text="${#temporals.format(incident.createdTime, 'MM/dd/yyyy h:mm a')}"></td></tr>
                         <tr><th>Location</th><td th:text="${#numbers.formatDecimal(incident.latitude, 1, 4)} + ', ' + ${#numbers.formatDecimal(incident.longitude, 1, 4)}"></td></tr>
                         <tr><th>Inury Severity</th><td th:text="${incident.injurySeverity}"></td></tr>
                         <tr><th>Vehicle</th><td th:text="${incident.vehicleYear} + ' ' + ${incident.vehicleMake} + ' ' + ${incident.vehicleModel}"></td></tr>
                         <tr><th>Vehcile Color</th><td th:text="${incident.vehicleColor}"></td></tr>
                         <tr th:if="${!incident.hideInfo}"><th>Licens Plate</th><td th:text="${incident.licensePlate}"></td></tr>
                         <tr><th>Diver Present</th><td th:text="${incident.driverPresent} ? 'Yes' : 'No'"></td></tr>
                         <tr th:if="${!incident.hideInfo}"><th>Driver Information</th><td th:text="${incident.driverInformation} != '' ? ${incident.driverInformation} : 'None'"></td></tr>
                         <tr th:if="${!incident.hideInfo}"><th>Comment</th><td th:text="${incident.extraComment} != '' ? ${incident.extraComment} : 'No Comment'"></td></tr>
                        </tbody>
                    </table>
                </div>
            <div th:if="${!incident.hideInfo}" class="panel">
                    <img class="panel" th:src="@{/Images/{id}${(id=incident.imageId)}}" onerror="this.onerror=null; this.src='/Images/PlaceHolder.jpg'"
                        style="display: block; margin-left: auto; margin-right: auto; width: 70%; height: auto">
                </div>
                

    </th:block>
</body>
</html>
