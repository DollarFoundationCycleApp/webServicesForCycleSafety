<html xmlns:th="http://www.thymeleaf.org"
        th:replace="~{viewTemplate :: viewLayout('My Incidents', 'Incidents You Reported', 'incidents', ~{::content})}">
<body>
    <th:block th:fragment="content">
        <!-- Page Specific content-->

        <form class="incident-picker" th:action="@{/incidents}" method="get">
            <label for="incident-select">Incident</label>
            <select id="incident-select" name="id" onchange="this.form.submit()">
                <option th:each="i : ${incidents}" th:value="${i.incidentId}" th:selected="${i.incidentId == incident.incidentId}"
                        th:text="${i.incidentId} + ' - ' + ${#temporals.format(i.createdTime, 'MM/dd/yyyy h:mm a')}">1 - 09/03/2026 8:15 AM</option>
            </select>
        </form>

        <div class="panel">
            <div class="panel-title" th:text="'Incident ' + ${incident.incidentId}">Incident</div>
            <table class="detail-table">
                <tbody>
                    <tr><th>Reported</th><td th:text="${#temporals.format(incident.createdTime, 'MM/dd/yyyy h:mm a')}"></td></tr>
                    <tr><th>Location</th><td th:text="${#numbers.formatDecimal(incident.latitude, 1, 4)} + ', ' + ${#numbers.formatDecimal(incident.longitude, 1, 4)}"></td></tr>
                    <tr><th>Injury Severity</th><td th:text="${incident.injurySeverity}"></td></tr>
                    <tr><th>Vehicle</th><td th:text="${incident.vehicleYear} + ' ' + ${incident.vehicleMake} + ' ' + ${incident.vehicleModel}"></td></tr>
                    <tr><th>Vehicle Color</th><td th:text="${incident.vehicleColor}"></td></tr>
                    <tr><th>License Plate</th><td th:text="${incident.licensePlate}"></td></tr>
                    <tr><th>Driver Present</th><td th:text="${incident.driverPresent} ? 'Yes' : 'No'"></td></tr>
                    <tr><th>Driver Information</th><td th:text="${incident.driverInformation} != '' ? ${incident.driverInformation} : 'None'"></td></tr>
                    <tr><th>Comment</th><td th:text="${incident.extraComment} != '' ? ${incident.extraComment} : 'No Comment'"></td></tr>
                    <tr><th>Private</th><td th:text="${incident.hideInfo} ? 'Yes' : 'No'"></td></tr>
                </tbody>
            </table>
        </div>
        <div class="panel">
            <img class="panel" th:src="@{/Images/{id}(id=${incident.imageId})}" onerror="this.onerror=null; this.src='/Images/PlaceHolder.jpg'"
                style="display: block; margin-left: auto; margin-right: auto; width: 70%; height: auto">
        </div>

    </th:block>
</body>
</html>
