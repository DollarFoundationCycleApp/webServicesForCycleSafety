<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cycle Safety Server - Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }

        .login-container {
            display: flex;
            width: 900px;
            height: 550px;
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }

        .hero-section {
            flex: 1.2;
            position: relative;
            background: url('/Images/RobDollarFoundation.jpg') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
        }

        .hero-title {
            color: #ffffff;
            font-size: 2.3rem;
            font-weight: bold;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.6);
        }

        .hero-logo span {
            display: block;
            font-size: 0.65rem;
            margin-top: 4px;
        }

        /* Right side form panel */
        .form-section {
            flex: 1;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-section h1 {
            font-size: 2rem;
            margin-bottom: 25px;
            color: #000000;
        }

        .subtitle {
            font-size: 0.9rem;
            font-weight: bold;
            color: #333333;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 0.85rem;
            color: #444444;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cccccc;
            border-radius: 2px;
            font-size: 0.9rem;
            outline: none;
        }

        .input-group input:focus {
            border-color: #ff6600;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            cursor: pointer;
            color: #666666;
            font-size: 0.85rem;
            user-select: none;
        }

        .forgot-link {
            align-self: flex-end;
            font-size: 0.75rem;
            color: #666666;
            text-decoration: underline;
            margin-top: 4px;
            cursor: pointer;
        }

        .submit-btn {
            background-color: #ff6600;
            color: #ffffff;
            border: 1px solid #000000;
            padding: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            border-radius: 2px;
            transition: background-color 0.2s ease;
        }

        .submit-btn:hover {
            background-color: #e55c00;
        }

        .login-message {
            min-height: 18px;
            margin-top: 12px;
            font-size: 0.8rem;
            color: #cc3333;
            font-weight: bold;
        }

        .join-text {
            margin-top: 25px;
            text-align: center;
            font-size: 0.8rem;
            color: #333333;
            font-weight: bold;
        }

        .join-text a {
            color: #ff6600;
            text-decoration: none;
        }

        .join-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="hero-section">
        <h2 class="hero-title">Cycle Safety Server</h2>
    </div>

    <div class="form-section">
        <h1>Login</h1>
        <p class="subtitle">Login to your account</p>

        <form id="login-form" action="/api/login" method="POST">
            <div class="input-group">
                <label for="email">Username or Email</label>
                <input type="text" id="email" name="email" value="" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" value="" required>
                    <span class="toggle-password" onclick="togglePasswordVisibility()">👁</span>
                </div>
                <a href="#" class="forgot-link">Forgot Password</a>
            </div>

            <button type="submit" class="submit-btn">Sign In</button>
        </form>
        <p id="login-message" class="login-message" aria-live="polite"></p>

        <p class="join-text">Dont have an account? <a href="#">Join Now</a></p>
    </div>
</div>

<script>
    const loginForm = document.getElementById('login-form');
    const loginMessage = document.getElementById('login-message');

    loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        loginMessage.textContent = '';

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    usernameOrEmail: email,
                    password: password
                })
            });

            const result = await response.json();

            if (!response.ok || !result.authenticated) {
                loginMessage.textContent = result.message || 'Invalid login.';
                return;
            }

            sessionStorage.setItem('sessionToken', result.sessionToken);
            sessionStorage.setItem('userId', result.userId);
            window.location.href = '/dashboard';
        } catch (error) {
            loginMessage.textContent = 'Unable to reach the server.';
        }
    });

    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('password');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
        } else {
            passwordInput.type = 'password';
        }
    }
</script>
</body>
</html>
