plugins {
    id 'java'
    id 'application'
    id 'com.google.protobuf' version '0.9.2'
    id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'CycleSafety'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Protocol Buffers
    implementation 'com.google.protobuf:protobuf-java:3.24.0'

    // MySQL JDBC Driver
    runtimeOnly 'com.mysql:mysql-connector-j:9.2.0'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Support Java 18-22
sourceCompatibility = '18'
targetCompatibility = '18'

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.24.0'
    }
}

// Configure source sets to include generated protobuf code
 sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/java'
        }
    }
}

// Task to run the server
task runServer(type: JavaExec) {
    group = 'CycleSafety'
    description = 'Run the Server'
    mainClass = 'Server.ServerStart'
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in

    if (project.hasProperty('args')) {
        args project.property('args').split()
    }
}

// Default application main class
application {
    mainClass = 'Server.ServerStart'
}

test {
    useJUnitPlatform()
    // Tests disabled by default since they require a running server
    // Enable with: gradle test
}
