services:
  mysql:
    image: mysql:8.0
    container_name: cyclesafety-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cyclenessafety_db
    ports:
      - "3306:3306"
    volumes:
      - cyclesafety-mysql-data:/var/lib/mysql
      - ./src/main/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  cyclesafety-mysql-data:
